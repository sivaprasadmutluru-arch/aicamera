spring.application.name=video-analytics-backend

# ==================== Database ====================
# Set these via environment variables in production (see docker-compose.yml / .env)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/video_analytics}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ==================== JPA / Hibernate ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==================== JWT ====================
# Secret comes from the JWT_SECRET env var in production.
app.jwt.secret=${JWT_SECRET:VideoAnalyticsBackendSecretKey2026ForJWTTokenGenerationAndValidation}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==================== Dahua DSS VMS Integration ====================
# DSS platform base URL and account credentials (Dahua_HTTP_API_for_DSS_V8.7).
app.dahua.base-url=${DAHUA_BASE_URL:https://192.168.1.1:443}
app.dahua.username=${DAHUA_USERNAME:system}
app.dahua.password=${DAHUA_PASSWORD:admin}
app.dahua.enabled=${DAHUA_ENABLED:false}
# Public base URL of this backend, used to register the DSS alarm-push callback.
app.dahua.callback-base-url=${DAHUA_CALLBACK_BASE_URL:}

# ==================== File Uploads ====================
# Where Dahua alarm snapshots (and other uploaded files) are stored/served from.
app.upload.dir=${UPLOAD_DIR:uploads}

# ==================== Server ====================
server.port=8081

# ==================== OpenAPI / Swagger ====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==================== Logging ====================
logging.level.com.prabhatech.videoanalytics=INFO
